name: beautypalast

services:
  db:
    image: mysql:8.4
    container_name: beautypalast-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - ./docker/mysql_data:/var/lib/mysql
    ports:
      - "${MYSQL_PUBLISHED_PORT:-3308}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - beautypalast-network

  app:
    build: .
    container_name: beautypalast-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET}
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
      PORT: 3000
    ports:
      - "${APP_PORT:-5000}:3000"
    volumes:
      - ./docker/uploads:/app/docker/uploads
    networks:
      - beautypalast-network
      - edge

  adminer:
    image: adminer
    container_name: beautypalast-adminer
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    networks:
      - beautypalast-network

networks:
  beautypalast-network:
    driver: bridge
  edge:
    external: true
