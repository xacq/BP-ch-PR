name: beautypalast

services:
  db:
    image: mysql:8.4
    container_name: beautypalast-db
    restart: unless-stopped
    command:
      - --innodb-buffer-pool-size=256M
      - --max-connections=50
      - --disable-log-bin
      - --performance-schema=OFF
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Europe/Zurich
    volumes:
      - ./docker/mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s
    networks:
      - internal

  app:
    build: .
    image: beautypalast-app:prod
    container_name: beautypalast-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET}
      SITE_URL: ${SITE_URL}
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
      PORT: 3000
      TZ: Europe/Zurich
    volumes:
      - ./docker/uploads:/app/docker/uploads
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      - internal

  nginx:
    image: nginx:1.27-alpine
    container_name: beautypalast-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    networks:
      - internal

  certbot:
    image: certbot/certbot:v4.1.1
    container_name: beautypalast-certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: certbot
    profiles:
      - tls

volumes:
  certbot_www:
  certbot_certs:

networks:
  internal:
    driver: bridge
